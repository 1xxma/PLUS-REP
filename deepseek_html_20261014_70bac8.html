<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLUS REP — Репетиторы, которым доверяют</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Иконка слева (потом заменишь свою) -->
        <a href="index.html" class="header-logo">
            <svg viewBox="0 0 40 40" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="18" stroke="#f7efd9" stroke-width="2.5"/>
                <path d="M13 26 L20 12 L27 26" stroke="#ffd166" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
            </svg>
        </a>

        <!-- Меню по центру -->
        <nav class="header-nav">
            <a href="subjects.html">РЕПЕТИТОРЫ</a>
            <a href="reviews.html">ОТЗЫВЫ</a>
            <a href="about.html">О НАС</a>
        </nav>

        <!-- Кнопки справа -->
        <div class="header-actions">
            <a href="login.html" class="btn btn-outline">ВОЙТИ</a>
            <a href="schedule.html" class="btn btn-accent">ЗАПИСЬ</a>
        </div>
    </header>

    <main class="hero">
        <h1 class="hero-title">Репетиторы,<br>которым доверяют.</h1>
        <p class="hero-subtitle">
            Только проверенные преподаватели. Чёткие цены, реальные результаты, поддержка на каждом этапе. Подберём преподавателя за пару минут.
        </p>
        <div class="hero-actions">
            <a href="subjects.html" class="btn btn-accent btn-lg">Найти репетитора</a>
            <a href="schedule.html" class="btn btn-outline btn-lg">Записаться</a>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const user = getCurrentUser();
            if (!user) return;

            // Находим кнопку "ВОЙТИ" и заменяем её на имя пользователя
            document.querySelectorAll('header a').forEach(link => {
                const text = link.textContent.trim();
                if (text === 'ВОЙТИ' || link.getAttribute('href') === 'login.html') {
                    link.textContent = user.name;
                    link.setAttribute('href', '#');
                    link.classList.add('user-name-link');
                    link.title = 'Нажмите, чтобы выйти';
                    link.addEventListener('click', function (e) {
                        e.preventDefault();
                        if (confirm('Выйти из аккаунта?')) logout();
                    });
                }
            });
        });
    </script>

</body>
</html>
